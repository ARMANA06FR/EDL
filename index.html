<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>État des lieux</title>
<meta name="theme-color" content="#0e6d8c">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EDL">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f6;--card:#fff;--ink:#17252d;--mut:#5d6d76;--line:#d5dde0;--acc:#0e6d8c;--accf:#fff;--nv:#7d8b94;--nf:#2a78c9;--be:#2e8b57;--eu:#a87b0c;--me:#c85d18;--hs:#c62f3b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11191d;--card:#1a252b;--ink:#e6eef1;--mut:#93a4ad;--line:#2c3a42;--acc:#4fb3d3;--accf:#08202a}}
:root[data-theme="dark"]{--bg:#11191d;--card:#1a252b;--ink:#e6eef1;--mut:#93a4ad;--line:#2c3a42;--acc:#4fb3d3;--accf:#08202a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
.top h1{font:600 20px 'Barlow Condensed',Barlow,sans-serif;margin:0;flex:1}
#st{font-size:13px;color:var(--mut)}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px}
.tb{flex:none;border:1px solid var(--line);background:none;color:var(--ink);padding:7px 12px;border-radius:8px;font:inherit;font-size:14px}
.tb.on{background:var(--acc);border-color:var(--acc);color:var(--accf)}
main{max-width:760px;margin:0 auto;padding:12px;padding-bottom:80px}
h2{font:600 22px 'Barlow Condensed',Barlow,sans-serif;margin:18px 0 8px}
h3{font-size:15px;margin:16px 0 6px;color:var(--mut);font-weight:600}
h3.strong{color:var(--ink);font-weight:700;font-size:16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.f{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.seg{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px}
.seg>span{color:var(--mut);margin-right:4px}
.it{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.it.warn{background:#fdf0dd;border-color:var(--eu);border-width:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .it.warn{background:#3a2f1a}}
:root[data-theme="dark"] .it.warn{background:#3a2f1a}
.it.filled{background:#eaf6ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .it.filled{background:#16281c}}
:root[data-theme="dark"] .it.filled{background:#16281c}
.mini.d{border-color:var(--hs);color:var(--hs)}
.tb .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--be);margin-left:5px;vertical-align:middle}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.hd b{flex:1}
.hd select{width:auto;max-width:50%;padding:5px}
.mini{border:1px solid var(--line);background:none;color:var(--mut);border-radius:7px;width:26px;height:26px;font:inherit;font-size:15px;line-height:1;flex:none}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.c{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:8px 12px;min-height:40px;font:inherit;font-size:14px;font-weight:500}
.c.on{background:var(--c,var(--acc));border-color:var(--c,var(--acc));color:var(--t,var(--accf))}
.rsub{margin:4px 0 0;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.rsub .c{padding:5px 9px;min-height:30px;font-size:12px;font-weight:400;opacity:.8;border-radius:7px}
.rsub .c.on{opacity:1}
.tc{width:90px!important;flex:none}
.tc input{padding:5px}
.ob{margin-top:6px;min-height:38px;resize:none;overflow:hidden}
.btn{display:inline-block;border:1px solid var(--acc);color:var(--acc);background:none;border-radius:8px;padding:9px 14px;font:inherit;font-size:15px;font-weight:500}
.btn.p{background:var(--acc);color:var(--accf)}
.btn.d{border-color:var(--hs);color:var(--hs)}
.btn.sm{padding:6px 10px;font-size:13px}
.lg{font-size:13px;color:var(--mut);margin:0 0 6px}
.ph{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ph div{position:relative}
.ph img{width:96px;height:96px;object-fit:cover;border-radius:8px}
.ph button{position:absolute;top:2px;right:2px;border:0;background:#000a;color:#fff;border-radius:50%;width:24px;height:24px}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
canvas.sg{width:100%;height:150px;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none}
canvas.sg.locked{border-color:var(--be);border-width:2px}
.act{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;align-items:center}
.cn{grid-template-columns:repeat(auto-fit,minmax(72px,1fr));margin:6px 0}
#qb{display:none;position:fixed;left:0;right:0;bottom:0;gap:6px;overflow-x:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);z-index:9}
#qb button{flex:none;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px}
#recap{display:none}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
#modal .card{background:var(--card);color:var(--ink);border-radius:12px;padding:18px;max-width:380px;width:100%;max-height:80vh;overflow:auto}
#modal .act button{text-align:left}
#recap.show{display:block;position:fixed;inset:0;background:var(--bg);color:var(--ink);overflow:auto;z-index:30;padding:16px}
#recap.show table{border-collapse:separate;border-spacing:0 6px;width:100%;margin:6px 0 14px;font-size:13px}
#recap.show td,#recap.show th{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
#recap.show tr td:first-child,#recap.show tr th:first-child{border-radius:8px 0 0 8px}
#recap.show tr td:last-child,#recap.show tr th:last-child{border-radius:0 8px 8px 0}
#recap.show th{background:#eef3f5;font-weight:600}
#recap.show img{max-width:160px;margin:3px}
#recap.show .hdband{background:#0e6d8c;color:#fff;border-radius:12px;padding:16px 20px;margin-bottom:12px}
#recap.show .hdband .brand{font-weight:800;font-size:20px;letter-spacing:.06em;display:block}
#recap.show .hdband .sub{font-size:13px;opacity:.9}
#recap.show .sum{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
#recap.show .sc{font-size:12px;padding:5px 10px;border-radius:20px;color:#333;font-weight:500}
#rcls{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:31}
@media print{header,main,#rcls{display:none}#recap{display:block;color:#000;background:#fff}}
</style>
</head>
<body>
<header>
  <div class="top"><h1>État des lieux</h1><span id="st"></span>
    <button class="btn d sm" id="neu">Nouveau</button>
    <label class="btn sm" title="Reprendre un EDL (JSON)">Importer<input type="file" accept="application/json" hidden id="imp"></label>
    <button class="btn sm" id="expj">JSON</button>
    <button class="btn sm" id="ape">Aperçu</button>
    <button class="btn sm" id="shr">Partager</button>
    <button class="btn p sm" id="exp">Exporter</button>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="app"></main>
<button class="btn p" id="rcls" style="display:none">Fermer l’aperçu</button>
<div id="recap"></div>
<div id="modal"><div class="card" id="modalBody"></div></div>
<div id="qb"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const ST=[['NV','Non vérifié','--nv'],['NF','Neuf','--nf'],['BE','Bon état','--be'],['EU','État d’usage','--eu'],['ME','Mauvais état','--me'],['HS','Hors service','--hs']];
const SOL=['Carrelage','Marbre','Parquet','Parquet flottant','Pierre naturelle','Lino/PVC','Béton'],PLI=['Carrelage','Marbre','Bois peint','Bois verni','PVC','Goulottes'],MUR=['Crépi','Peint','Papier peint','Toile de verre'],VMC=['VMC','Autogyre','VH','VB','VH + VB'];
const DMAT=['Bois peint','Bois verni','Verre','Alu','Métal','Autre'],CRED=['Faïence','Stratifié','Verre','Inox','Autre'],REV=['Émail','Céramique','Pierre naturelle','Composite','Verre','Béton','Autre'];
const PRI=['Prises',null,['PC','Tel','TV']],ECL=['Éclairage',null,['Plafonnier','Applique','Amp. EU','Amp. HS/abs','Néon','Fils nus']];
const NOTRCH=new Set(['Interphone / visiophone','Serrure','Judas','Chauffage','Sonnette','Prises','Éclairage','Ventilation','Robinets','Siphon','Mélangeur','Joint silicone','Évier','Miroir','Pare-douche','Porte-douchette','Porte-serviette','Lave-main']);
const CHAUF=['Radiateur','Convecteur','Climatisation','Télécommande'];
const SERR=['Serrure / verrou',['Serrure','Verrou','Loquet'],null,null,null,{when:'Serrure',label:'Nombre de clés'}];
const VOLM=['Bois peint','Bois verni','Alu','PVC'];
const BASE=[['Porte d’accès',DMAT],SERR,['Sol',SOL],['Plinthes',PLI],['Murs',MUR],['Plafond',MUR],
  ['Chauffage',CHAUF,['Nb'],null,1],['Ouvertures',['Simple vitrage','Double vitrage','Baie coulissante'],['Fen.','P.fen.'],null,1],
  ['Volets',['Roulant','Battant','Pliant','Coulissant'],['Nb'],null,1,null,VOLM],['Placards',null,['Portes','Rayons','Tiroirs'],null,1],PRI,ECL];
const SDB_BASE=BASE.map(x=>x[0]==='Chauffage'?['Chauffage',[...CHAUF,'Sèche-serviette'],['Nb'],null,1]:x);
const WCF=['Réservoir','Cuvette','Abattant','Robinet de chasse'];
const TPL={
 base:{l:'Pièce (séjour, chambre…)',i:BASE},
 entree:{l:'Entrée',i:[['Porte palière',DMAT],['Serrure'],['Verrou',['Verrou haut','Verrou bas'],null,null,1],['Sonnette'],['Judas'],['Interphone / visiophone',['Interphone','Visiophone']],...BASE.filter(x=>x[0]!=='Porte d’accès'&&x!==SERR)]},
 cuisine:{l:'Cuisine',i:[...BASE,['Évier',['Grès','Inox','Résine','Pierre naturelle','Verre']],['Joint silicone'],['Mélangeur'],['Siphon'],['Placard sous évier',null,['Portes','Rayons','Tiroirs'],null,1],['Plan de travail'],['Robinets',null,null,['Gaz','MàL']],['Crédence',CRED],['Ventilation',VMC,null,null,1]]},
 sdb:{l:'Salle de bain',i:[...SDB_BASE,['Placard sous lavabo',null,['Portes','Rayons','Tiroirs'],null,1],['Miroir',null,['Nombre'],null,1],['Pare-douche'],['Porte-douchette'],['Porte-serviette'],['Faïence'],['Ventilation',VMC,null,null,1]]},
 wc:{l:'WC',i:[['Porte d’accès',DMAT],SERR,['Sol',SOL],['Murs',MUR],['Plafond',MUR],ECL,['Ventilation',VMC,null,null,1],['Placard',null,['Portes','Rayons','Tiroirs'],null,1],['Porte papier']]},
 balcon:{l:'Balcon',i:[['Sol',SOL],['Plinthe',PLI],['Façade',MUR],['Plafond',MUR],['Placard',null,['Portes','Rayons','Tiroirs'],null,1],PRI,ECL,['Garde-corps'],['Prélat'],['Store banne']]},
 garage:{l:'Garage',i:[['Porte d’accès',DMAT],SERR,['Porte de garage'],['Sol',SOL],['Murs',MUR],['Plafond',MUR],['Ouvertures',null,null,null,1],['Placards',null,['Portes','Rayons','Tiroirs'],null,1],PRI,ECL]},
 cave:{l:'Cave',i:[['Porte d’accès',DMAT],SERR,['Sol',SOL],['Murs',MUR],['Plafond',MUR],['Ouvertures',null,null,null,1],PRI,ECL]},
 ext:{l:'Jardin / extérieur',i:[['Pelouse'],['Allées'],['Haies',['≤ 2 m','> 2 m']],['Terrasses'],['Arbres / plantes'],['Façade'],['Auvent'],['Pergolas'],PRI,ECL,['Grillage'],['Murs de clôture'],['Portail d’entrée'],['Autre portail'],['Divers']]}
};
const GEN=[
['Rendez-vous',[['client','Client (propriétaire)'],['cliente','E-mail client'],['clientte','Téléphone client'],['rdv','N° RDV'],['date','Date','date'],['heure','Heure','time'],['cadr','Adresse du client'],['ccp','Code postal'],['cville','Ville']]],
['Logement',[['typ','Type (T2, T3…)'],['etage','Étage'],['digi','Digicode'],['hp','H/plafond'],['adr','Adresse du logement'],['cp','Code postal'],['ville','Ville'],['meub','Logement',['Vide','Meublé']],['inv','Inventaire',['À établir','À contrôler','À ignorer']]]],
['Locataires',[['ent','Locataire entrant'],['entem','E-mail entrant'],['entte','Téléphone entrant'],['sor','Locataire sortant'],['sorem','E-mail sortant'],['sorte','Téléphone sortant'],['nadr','Nouvelle adresse du sortant'],['ncp','Code postal'],['nville','Ville']]]];
const CPT=[
['Équipements',[['ecs','Eau chaude',['Cumulus','Chauffe-eau gaz','Collectif']],['ecsm','Marque / modèle'],['chf','Chauffage',['Indiv. élec.','Indiv. gaz','Collectif']],['daaf','DAAF',['Oui','Non']],['daafl','Emplacement DAAF'],['cert','Certificat d’entretien',['Oui','Non']],['coupe','Alimentation coupée (sous réserve)',['Aucune','Eau','Électricité','Eau + élec.']]]],
['Villa / maison',[['chd','Chaudière',['Fuel','Gaz']],['cuve','Niveau cuve (litres)'],['chc','Certificat d’entretien chaudière',['Oui','Non']],['chdate','Daté du','date']]]];
const MT={'Eau':['Froide (m³)','Chaude (m³)'],'Électricité':['HP (kWh)','HC (kWh)'],'Gaz':['Index (m³)',''],'Autre':['Index 1','Index 2']};
const SS=ST.map(x=>x[0]),SN=['Baignoire','Douche','Lavabo','Bidet'],SC=['Mél./Mitig.','Bonde','Siphon','Jt silicone','Flexible','Douchette','Inverseur'];
const ANN0=['Boîte à lettres','Cave','Garage','Grenier'];
const KEYS0=['Porte immeuble','Serrure principale','Verrou haut','Verrou bas','Boîte à lettres','Accès cave','Cave','Accès garage','Garage','Grenier','Porte SAS','Clé magnétique','Émetteur','Non identifiées'];
const SIG=[['sgS','Locataire sortant / représentant','sor'],['sgE','Locataire entrant / représentant','ent'],['sgP','Propriétaire','client'],['sgX','Expert DIAG-LOC','']];
const GENKEYS=GEN.flatMap(([,f])=>f.map(x=>x[0])),CPTKEYS=CPT.flatMap(([,f])=>f.map(x=>x[0]));
const QB=['TDH','Fiss.','Éclats','Rayures','DDE','Traces','Colmatages','Reprises peinture','Sale','Ancien','Usure normale','Mal fixé','Cassé','Impact','(BE)','(EU)','(ME)'];
const DD=['Table','Chaise','Table basse','Meuble TV','Télévision','Canapé','Canapé-lit','Fauteuil','Lit','Matelas','Sommier','Alèse','Armoire','Commode','Bureau','Miroir','Rideaux','Store vénitien','Tringle','Lampadaire','Suspension','Lustre','Frigo-congélateur','Four','Micro-ondes','Plaque vitro','Plaque induction','Hotte','Lave-linge','Bouilloire','Grille-pain','Machine à café','Aspirateur','Fer à repasser','Planche à repasser','Sèche-cheveux','Vaisselle','Poubelle','Étendoir','Table de jardin','Chaise de jardin'];
const uid=()=>'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function fresh(){return {v:{sgXn:'ARMANA Frédéric'},rooms:[{id:'r1',n:'Entrée',t:'entree'},{id:'r2',n:'Cuisine',t:'cuisine'},{id:'r3',n:'Séjour',t:'base'},{id:'r4',n:'Chambre 1',t:'base'},{id:'r5',n:'Chambre 2',t:'base'},{id:'r6',n:'Salle de bain',t:'sdb'},{id:'r7',n:'WC',t:'wc'}],
 ph:{},tab:'gen',cp:[{id:'c1',t:'Eau',orig:1},{id:'c2',t:'Électricité',orig:1},{id:'c3',t:'Gaz',orig:1}],x:{},iv:[],san:{},
 an:ANN0.map((n,i)=>({id:'a'+i,n,orig:1})),kl:KEYS0.map((n,i)=>({id:'k'+i,n,orig:1}))}}
let S=fresh();
function loadLS(){try{const a=localStorage.getItem('edl1');if(a)Object.assign(S,JSON.parse(a));const p=localStorage.getItem('edl1p');if(p)S.ph=JSON.parse(p)}catch(e){}}
loadLS();
let tm;
function msg(t){$('#st').textContent=t;clearTimeout(tm);tm=setTimeout(()=>$('#st').textContent='',2500)}
function save(){try{localStorage.setItem('edl1',JSON.stringify({v:S.v,rooms:S.rooms,tab:S.tab,cp:S.cp,x:S.x,iv:S.iv,an:S.an,kl:S.kl,san:S.san}))}catch(e){msg('Sauvegarde impossible')}}
function savePh(){try{localStorage.setItem('edl1p',JSON.stringify(S.ph))}catch(e){msg('Mémoire pleine : exporte avant de continuer')}}
const isSortant=()=>!!S.v.sensS;

const chip=(k,v,l,t,col)=>`<button class="c${S.v[k]===v?' on':''}" data-k="${esc(k)}" data-v="${esc(v)}"${col?` style="--c:var(${col});--t:#fff"`:''}${t?` title="${esc(t)}"`:''}>${esc(l)}</button>`;
if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js').catch(()=>{})}

const sel=(k,o)=>`<select data-k="${esc(k)}"><option value="">—</option>${o.map(x=>`<option${S.v[k]===x?' selected':''}>${esc(x)}</option>`).join('')}</select>`;
function fld([k,l,t]){
  if(Array.isArray(t))return `<div class="seg"><span>${esc(l)}</span>${t.map(o=>chip(k,o,o)).join('')}</div>`;
  return `<label class="f">${esc(l)}<input data-k="${k}" type="${t||'text'}" value="${esc(S.v[k]||'')}"></label>`;
}
const groups=G=>G.map(([t,f])=>`<h3>${esc(t)}</h3><div class="g">${f.map(fld).join('')}</div>`).join('');
function contactsBlock(){
  const P=[['Client',S.v.client,S.v.cliente,S.v.clientte],['Locataire entrant',S.v.ent,S.v.entem,S.v.entte],['Locataire sortant',S.v.sor,S.v.sorem,S.v.sorte]];
  const rows=P.filter(([l,n,e,t])=>n||e||t).map(([l,n,e,t],i)=>{
    const nk=i===0?'cliente':i===1?'entem':'sorem',tk=i===0?'clientte':i===1?'entte':'sorte';
    return `<div class="it"><b>${esc(l)}${n?' — '+esc(n):''}</b><div class="row">${e?`<button class="btn sm" data-act="copy" data-src="${nk}">Copier l’e-mail</button>`:''}${t?`<button class="btn sm" data-act="copy" data-src="${tk}">Copier le tél.</button>`:''}</div></div>`;
  }).join('');
  return rows?`<h3 class="strong">Contacts</h3>${rows}`:'';
}
const nm=(k,d)=>k==='sgX'?(S.v.sgXn||'ARMANA Frédéric'):(S.v[k+'n']??S.v[d]??'');
const ob=k=>`<textarea class="ob" rows="1" data-k="${k}b" placeholder="Observations">${esc(S.v[k+'b']||'')}</textarea>`;
const grow=t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'};
const NOETAT=new Set(['Éclairage']),DEFNV=new Set(['Prises','Robinets']);
function item(p,key,def,flags=true,dupBase){
  const [name,opts,cn,chk,dup,cond,opts2]=def,k=p+'.'+key,sortant=isSortant(),notrch=NOTRCH.has(dupBase||name),removable=key.charAt(0)==='e',noetat=NOETAT.has(dupBase||name);
  if(DEFNV.has(dupBase||name)&&S.v[k+'s']===undefined)S.v[k+'s']='NV';
  const fl=(s,l,ti)=>`<button class="c${S.v[k+s]?' on':''}" data-k="${k+s}" data-t="1"${ti?` title="${ti}"`:''}>${l}</button>`;
  const partial=S.v[k+'o']||S.v[k+'b']||(cn&&cn.some((c,j)=>S.v[k+'c'+j]))||(chk&&chk.some((c,j)=>S.v[k+'x'+j]));
  const warn=partial&&!S.v[k+'s'];

async function shrink(f){
  const b=await createImageBitmap(f),s=Math.min(1,900/Math.max(b.width,b.height)),c=document.createElement('canvas');
  c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.6);
}
function sigInit(){
  document.querySelectorAll('canvas.sg').forEach(c=>{
    const k=c.dataset.k,x=c.getContext('2d');c.width=c.clientWidth*2;c.height=c.clientHeight*2;
    x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.lineWidth=4;x.lineCap='round';x.strokeStyle='#000';
    if(S.v[k]){const im=new Image();im.onload=()=>x.drawImage(im,0,0,c.width,c.height);im.src=S.v[k]}
    if(S.v[k+'lock'])return;
    let on=false;const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
    c.onpointerdown=e=>{on=true;c.setPointerCapture(e.pointerId);const[a,b]=p(e);x.beginPath();x.moveTo(a,b)};
    c.onpointermove=e=>{if(!on)return;const[a,b]=p(e);x.lineTo(a,b);x.stroke()};
    c.onpointerup=()=>{if(!on)return;on=false;S.v[k]=c.toDataURL('image/png');save()};
  });
}
const STCLR={NV:'#eef1f2',NF:'#e6f2fa',BE:'#e8f5ec',EU:'#fdf3e2',ME:'#fbe9e0',HS:'#fbe4e6'};
const STL={NV:'Non vérifié',NF:'Neuf',BE:'Bon état',EU:'État d’usage',ME:'Mauvais état',HS:'Hors service'};
function recap(){
  const cnt={r1:0,r2:0};const tick=s=>{if(s)cnt[s]=(cnt[s]||0)+1};
  const row=(a,b)=>b?`<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`:'';
  const rowS=(a,b,s)=>b?`<tr style="background:${STCLR[s]||''}"><td>${esc(a)}</td><td>${esc(b)}</td></tr>`:'';
  const tbl=G=>G.map(([t,f])=>`<h2>${esc(t)}</h2><table>${f.map(([k,l])=>row(l,S.v[k])).join('')}</table>`).join('');
  const typ=[S.v.sensE&&'Entrant',S.v.sensS&&'Sortant'].filter(Boolean).join(' + ')||'—';
  let h=`<div class="hdband"><span class="brand">DIAG-LOC</span><span class="sub">Constat d’état des lieux</span></div><table>${row('Type d’état des lieux',typ)}</table>${tbl(GEN)}<h2>Compteurs</h2><table>${S.cp.map(c=>{const k='cp'+c.id,l=MT[c.t];return row(c.t+(S.v[k+'n']?' n° '+S.v[k+'n']:'')+(S.v[k+'e']?' ('+S.v[k+'e']+')':''),[S.v[k+'a']&&l[0]+' : '+S.v[k+'a'],S.v[k+'b']&&l[1]+' : '+S.v[k+'b']].filter(Boolean).join(' — '))}).join('')}</table>${tbl(CPT)}`;
  const line=(p,key,def)=>{const [n,o,cn,chk,dp,cond]=def,k=p+'.'+key,s=S.v[k+'s'],b=S.v[k+'b'];
    const ty=[S.v[k+'o'],S.v[k+'o2'],...(cn||[]).map((c,j)=>S.v[k+'c'+j]?c+' '+S.v[k+'c'+j]:''),...(chk||[]).map((c,j)=>S.v[k+'x'+j]?c:''),cond&&S.v[k+'cc']?cond.label+' '+S.v[k+'cc']:''].filter(Boolean).join(', ');
    if(!(s||b||ty||S.v[k+'t']||S.v[k+'1']||S.v[k+'2']))return '';
    tick(s);if(S.v[k+'1'])cnt.r1++;if(S.v[k+'2'])cnt.r2++;
    return `<tr style="background:${STCLR[s]||''}"><td>${esc(n)}</td><td>${esc(ty)}</td><td>${esc(s||'')}</td><td>${esc(S.v[k+'t']||'')}</td><td>${S.v[k+'1']?'×':''}</td><td>${S.v[k+'2']?'×':''}</td><td>${esc(b||'')}</td></tr>`};
  const th='<tr><th>Élément</th><th>Détail</th><th>État</th><th>TrCh</th><th>1</th><th>2</th><th>Observations</th></tr>';
  const sanRowGen=(k,n)=>{const s=S.v[k+'s'];tick(s);return rowS(n,[S.v[k+'r'],s,...SC.map((c,j)=>S.v[k+j]&&c+' '+S.v[k+j]),S.v[k+'b']].filter(Boolean).join(' · '),s)};
  const snr=id=>SN.map((n,i)=>sanRowGen('sn'+id+'.'+i+'.',n)).join('')+(S.san[id]||[]).map(eid=>sanRowGen('sn'+id+'.x'+eid+'.','Lavabo')).join('');
  const wcr=id=>{const k='wcg'+id+'.';WCF.forEach((c,j)=>tick(S.v[k+j]));return row('WC',[...WCF.map((c,j)=>S.v[k+j]&&c+' '+S.v[k+j]),S.v[k+'b']].filter(Boolean).join(' · '))};
  const lavR=id=>{const k='wcs'+id+'.',s=S.v[k+'s'];tick(s);return rowS('Lave-main',[S.v[k+'r'],s,...SC_LAV.map((c,j)=>S.v[k+j]&&c+' '+S.v[k+j]),S.v[k+'b']].filter(Boolean).join(' · '),s)};
  S.rooms.forEach(r=>{const ex=S.x[r.id]||[];
    h+=`<h2>${esc(r.n)}</h2><table>${th}${r.t==='wc'?wcr(r.id)+lavR(r.id):''}${TPL[r.t].i.map((x,i)=>line(r.id,'t'+i,x)+ex.filter(e=>e.base===x[0]).map(e=>line(r.id,e.id,[e.n,e.o,e.c,e.k])).join('')).join('')}${ex.filter(e=>!e.base).map(e=>line(r.id,e.id,[e.n,e.o,e.c,e.k])).join('')}</table>${r.t==='sdb'?`<table>${snr(r.id)}</table>`:''}${(S.ph[r.id]||[]).map(d=>`<img src="${d}">`).join('')}`});
  if(S.iv.length)h+=`<h2>Inventaire du mobilier</h2><p>Entrée : ${esc(S.v.ive||'')} — Sortie : ${esc(S.v.ivs||'')}</p><table><tr><th>Pièce</th><th>Description</th><th>Nbre</th><th>État</th><th>Aspect</th><th>Observations</th><th>1</th><th>2</th></tr>${S.iv.map(r=>{const k='iv'+r.id;tick(S.v[k+'s']);if(S.v[k+'1'])cnt.r1++;if(S.v[k+'2'])cnt.r2++;return `<tr style="background:${STCLR[S.v[k+'s']]||''}">${['p','d','n','s','a','b'].map(x=>`<td>${esc(S.v[k+x]||'')}</td>`).join('')}<td>${S.v[k+'1']?'×':''}</td><td>${S.v[k+'2']?'×':''}</td></tr>`}).join('')}</table>${S.iv.map(r=>(S.ph['iv'+r.id]||[]).map(d=>`<img src="${d}">`).join('')).join('')}${(S.ph.inv||[]).map(d=>`<img src="${d}">`).join('')}`;
  h+=`<h2>Annexes</h2><table>${S.an.map(o=>{const k='an'+o.id+'.';return row(o.n+(S.v[k+'num']?' n° '+S.v[k+'num']:''),[S.v[k+'p']&&'porte '+S.v[k+'p'],S.v[k+'s']&&'serrure '+S.v[k+'s'],S.v[k+'m']&&'à vider '+S.v[k+'m'],S.v[k+'b']].filter(Boolean).join(' · '))}).join('')}</table>`;
  h+=`<h2>Clés</h2><table>${S.kl.map(o=>{const k='kl'+o.id+'.';return row(o.n||'Clé',[S.v[k+'q']&&('qté '+S.v[k+'q']),S.v[k+'s']].filter(Boolean).join(' · '))}).join('')}${row('Total',String(total()))}${row('Observations',S.v.clesgb)}</table>`;
  if(isSortant())h+=`<h2>Nettoyage général</h2><table>${row('État',S.v.net)}${row('Observations',S.v.netgb)}</table>`;
  h+=`<h2>Signatures</h2><table>${row('Date d’entrée',S.v.dent)}${row('Commentaire du locataire',S.v.com)}</table>`;
  SIG.forEach(([k,l,d])=>{if(S.v[k]||nm(k,d))h+=`<p>${esc(l)} ${esc(nm(k,d))}<br>${S.v[k]?`<img src="${S.v[k]}" style="max-width:260px;border:1px solid #999">`:''}</p>`});
  const sum=Object.keys(STL).map(k=>cnt[k]?`<span class="sc" style="background:${STCLR[k]}">${cnt[k]} ${STL[k]}</span>`:'').join('')
    +(cnt.r1?`<span class="sc" style="background:${STCLR.ME}">${cnt.r1} à réparer</span>`:'')
    +(cnt.r2?`<span class="sc" style="background:${STCLR.NV}">${cnt.r2} à nettoyer</span>`:'');
  const bandEnd=h.indexOf('</div>')+6;
  return h.slice(0,bandEnd)+(sum?`<div class="sum">${sum}</div>`:'')+h.slice(bandEnd);
}
function buildDoc(){
  const h=recap();
  return '<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>État des lieux — DIAG-LOC</title><style>body{font:14px/1.4 system-ui,sans-serif;margin:20px;color:#17252d;max-width:900px}table{border-collapse:separate;border-spacing:0 6px;width:100%;margin:6px 0 16px;font-size:13px}td,th{border:1px solid #e2e6e8;padding:7px 9px;text-align:left;vertical-align:top}tr td:first-child,tr th:first-child{border-radius:8px 0 0 8px}tr td:last-child,tr th:last-child{border-radius:0 8px 8px 0}th{background:#eef3f5;font-weight:600}h2{margin:20px 0 4px;font-size:17px}img{max-width:160px;margin:3px;border-radius:6px}.hdband{background:#0e6d8c;color:#fff;border-radius:12px;padding:18px 22px;margin-bottom:14px}.hdband .brand{font-weight:800;font-size:22px;letter-spacing:.06em;display:block}.hdband .sub{font-size:13px;opacity:.9}.sum{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}.sc{font-size:12px;padding:5px 10px;border-radius:20px;color:#333;font-weight:500}@media print{body{margin:8mm}}</style><body>'+h;
}
const docName=()=>(S.v.rdv?S.v.rdv+' ':'')+'EDL.html';
$('#exp').onclick=async()=>{
  const doc=buildDoc(),name=docName();
  try{const d=window.claude&&await claude.use('downloads');
    if(d){await d.save({filename:name,data:doc});return}}catch(e){if(e&&e.code==='declined')return}
  const blob=new Blob([doc],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
};
$('#neu').onclick=()=>{
  if($('#neu').dataset.ok!=='1'){$('#neu').dataset.ok='1';$('#neu').textContent='Confirmer (efface tout)';
    setTimeout(()=>{$('#neu').dataset.ok='';$('#neu').textContent='Nouveau'},4000);return}
  S=fresh();S.ph={};$('#recap').classList.remove('show');$('#rcls').style.display='none';
  render();save();savePh();$('#neu').dataset.ok='';$('#neu').textContent='Nouveau';
};
$('#ape').onclick=()=>{$('#recap').innerHTML=recap();$('#recap').classList.add('show');$('#rcls').style.display='block';scrollTo(0,0)};
$('#shr').onclick=async()=>{
  const doc=buildDoc(),name=docName();
  const file=new File([doc],name,{type:'text/html'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'État des lieux — DIAG-LOC',text:'Constat d’état des lieux'});return}
    catch(e){if(e&&e.name==='AbortError')return;msg('Partage annulé')}
  }else{
    msg('Partage natif non disponible — utilise Exporter puis joins le fichier toi-même');
  }
};
$('#rcls').onclick=()=>{$('#recap').classList.remove('show');$('#recap').innerHTML='';$('#rcls').style.display='none'};
$('#expj').onclick=async()=>{
  const name='EDL_'+(S.v.date||new Date().toISOString().slice(0,10))+'.json';
  const data=JSON.stringify({v:S.v,rooms:S.rooms,cp:S.cp,x:S.x,iv:S.iv,an:S.an,kl:S.kl,ph:S.ph});
  try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:name,data});return}}catch(e){}
  const a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(data);a.download=name;a.click();
};
let pendingImport=null;
function showModal(html){$('#modalBody').innerHTML=html;$('#modal').classList.add('show')}
function hideModal(){$('#modal').classList.remove('show');$('#modalBody').innerHTML=''}
function applyImport(j,toSortie){
  S.v=j.v||{};S.rooms=j.rooms||S.rooms;S.cp=j.cp||S.cp;S.x=j.x||{};S.iv=j.iv||[];S.san=j.san||{};
  S.an=j.an||S.an;S.kl=j.kl||S.kl;S.ph=j.ph||{};
  if(toSortie){
    S.v.sensS=true;delete S.v.sensE;
    if(S.v.ent)S.v.sor=S.v.ent;if(S.v.entem)S.v.sorem=S.v.entem;if(S.v.entte)S.v.sorte=S.v.entte;
    delete S.v.ent;delete S.v.entem;delete S.v.entte;
    S.ph={};
    SIG.forEach(([k])=>{delete S.v[k]});
    S.rooms.forEach(r=>{delete S.v[r.id+'.done']});
    delete S.v.rdv;delete S.v.date;delete S.v.heure;
  }
  S.tab='gen';render();save();savePh();
  msg(toSortie?'Repris pour la sortie — relis chaque pièce':'EDL rouvert');
}
$('#imp').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{pendingImport=JSON.parse(await f.text())}catch(x){msg('Fichier illisible');e.target.value='';return}
  showModal(`<h3 class="strong">Que veux-tu faire de ce fichier ?</h3>
    <p class="lg">Choisis selon l’usage de cet EDL.</p>
    <div class="act" style="flex-direction:column;align-items:stretch">
      <button class="btn p sm" data-act="impSortie">Préparer la sortie<br><span style="font-weight:400;font-size:12px">Locataire entrant → sortant, photos et signatures effacées, N° RDV/date/heure vidés</span></button>
      <button class="btn sm" data-act="impAsis">Modifier cet EDL tel quel<br><span style="font-weight:400;font-size:12px">Rien n’est modifié, y compris photos et signatures</span></button>
      <button class="btn d sm" data-act="impCancel">Annuler</button>
    </div>`);
  e.target.value='';
};
$('#qb').innerHTML=QB.map(x=>`<button>${esc(x)}</button>`).join('');
$('#qb').addEventListener('pointerdown',e=>e.preventDefault());
$('#qb').addEventListener('click',e=>{const b=e.target.closest('button'),t=document.activeElement;if(!b||!t||!t.classList.contains('ob'))return;
  const v=t.value,p=t.selectionStart??v.length,s=(v&&!/[\s\/(]$/.test(v.slice(0,p))?' ':'')+b.textContent;
  t.setRangeText(s,p,t.selectionEnd??p,'end');S.v[t.dataset.k]=t.value;grow(t);save()});
document.addEventListener('focusin',e=>{$('#qb').style.display=e.target.classList&&e.target.classList.contains('ob')?'flex':'none'});
render();
</script>
